<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f6f47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쿠팡 현황판">
<title>쿠팡 공사 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* 티에스코어 초록 기반 현장 사무실 톤: 흰 종이 + 초록 잉크, 상태색은 따로 */
  --bg:#f3f5f1; --surface:#ffffff; --ink:#18231c; --muted:#5b6a60; --line:#dce3dc; --soft:#eef3ee;
  --accent:#1f6f47; --accent-ink:#ffffff; --accent-soft:#e2f0e7;
  --danger:#b93a26; --danger-soft:#fbe9e5; --warn:#a86a0c; --warn-soft:#fbf0dc; --ok:#2d7d4f;
  --p1:#3f6ea8; --p2:#c0841a; --p3:#1f6f47; --p4:#6d5a96;
  --font-display:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --ink:#e6ede7; --muted:#9aaa9f; --line:#2c3830; --soft:#202a23;
  --accent:#5fbf8a; --accent-ink:#0d1a12; --accent-soft:#1f3328;
  --danger:#f08a73; --danger-soft:#3a201b; --warn:#e3b05a; --warn-soft:#382c16; --ok:#6cc792;
  --p1:#7fa6db; --p2:#e0aa4c; --p3:#5fbf8a; --p4:#a895d4; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --ink:#e6ede7; --muted:#9aaa9f; --line:#2c3830; --soft:#202a23;
  --accent:#5fbf8a; --accent-ink:#0d1a12; --accent-soft:#1f3328;
  --danger:#f08a73; --danger-soft:#3a201b; --warn:#e3b05a; --warn-soft:#382c16; --ok:#6cc792;
  --p1:#7fa6db; --p2:#e0aa4c; --p3:#5fbf8a; --p4:#a895d4; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
.num,td,.dday{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;flex:none}
.brand h1{font-size:17px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--font-body);font-weight:400}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px}
.editbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.editbtn svg{width:16px;height:16px}
body.editing .editbtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.editbar{display:none;background:var(--accent);color:var(--accent-ink);font-size:13px;text-align:center;padding:4px 16px}
body.editing .editbar{display:block}
.demo-note{background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center;padding:5px 16px}

main{max-width:1120px;margin:0 auto;padding:18px 16px 96px;display:flex;flex-direction:column;gap:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:17px}
.sec-h .sub{color:var(--muted);font-size:13px}

/* 숫자 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-family:var(--font-display);font-size:26px;line-height:1.2}
.tile.warn .v{color:var(--warn)} .tile.danger .v{color:var(--danger)}

/* 목록 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.dday{flex:none;min-width:52px;text-align:center;font-size:12.5px;font-weight:700;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--muted)}
.dday.d0,.dday.d1,.dday.d2{background:var(--danger-soft);color:var(--danger)}
.dday.d3,.dday.d4,.dday.d5,.dday.d6,.dday.d7{background:var(--warn-soft);color:var(--warn)}
.row .main{flex:1;min-width:0}
.row .main>span{display:block}
.back svg{width:16px;height:16px}
.row .pill{flex:none}
.row .t{font-weight:500}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .date{color:var(--muted);font-size:13px;white-space:nowrap}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}

.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.p1{color:var(--p1)} .pill.p2{color:var(--p2)} .pill.p3{color:var(--p3)} .pill.p4{color:var(--p4)}

/* 현장 탭·카드 */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:160px;max-width:280px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:9px;text-align:left}
.card:hover{border-color:var(--accent)}
.card.closed{opacity:.6}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-h h3{font-size:16px}
.card .st{font-size:13.5px;color:var(--muted)}
.card .meta{display:flex;gap:12px;color:var(--muted);font-size:12.5px}
.bar{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
.bar i{height:7px;border-radius:2px;background:var(--line)}
.bar i.done{background:var(--accent)} .bar i.skip{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.bar i.now,.bar i.wait{background:var(--warn)} .bar i.plan{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)} .bar i.lost{background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:7px;border-radius:2px;display:inline-block}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px}
.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.d-head h2{font-size:22px}
.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stage{flex:none;width:92px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);text-align:left;cursor:default}
body.editing .stage{cursor:pointer}
.stage .n{font-size:11.5px;color:var(--muted)}
.stage .v{font-size:13px;font-weight:500;min-height:20px;white-space:pre-line;line-height:1.35}
.stage.done{border-color:var(--accent);background:var(--accent-soft)} .stage.done .v{color:var(--accent)}
.stage.now,.stage.wait{border-color:var(--warn);background:var(--warn-soft)} .stage.now .v,.stage.wait .v{color:var(--warn)}
.stage.plan{border-style:dashed;border-color:var(--accent)}
.stage.skip .v{color:var(--muted)}
.stage.lost{border-color:var(--danger);background:var(--danger-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:0;font-size:14px}
.kv div{padding:8px 14px;border-top:1px solid var(--line);white-space:pre-line}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--muted);background:var(--soft)}
.lockbox{padding:14px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.lockbox svg{width:18px;height:18px;flex:none}
.log{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:12px}
.log:first-child{border-top:0}
.log .ld{flex:none;width:54px;font-size:13px;color:var(--muted);padding-top:2px}
.log .lb{flex:1;min-width:0}
.log .lt{white-space:pre-line}
.log .lr{margin-top:4px;font-size:13.5px;color:var(--muted);white-space:pre-line;padding-left:10px;border-left:2px solid var(--line)}
.log.open{background:linear-gradient(90deg,var(--danger-soft),transparent 40%)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.ed{display:none} body.editing .ed{display:inline-flex}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500;align-items:center;gap:5px;display:inline-flex}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
.btn svg{width:15px;height:15px}
.mini{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
.mini:hover{background:var(--soft);color:var(--ink)}
table.docs{width:100%;border-collapse:collapse;font-size:14px}
table.docs th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;background:var(--soft);padding:7px 12px}
table.docs td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl-wrap{overflow-x:auto}

/* 달력 */
.cal-h{display:flex;align-items:center;gap:10px}
.cal-h h2{font-size:19px;min-width:120px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:var(--soft);text-align:center;font-size:12.5px;color:var(--muted);padding:6px 0}
.cal .wd.sun,.cal .day.sun .dn{color:var(--danger)}
.day{background:var(--surface);min-height:98px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;border:0}
.day.out{background:var(--soft)} .day.out .dn{opacity:.4}
.day .dn{font-size:12.5px;font-weight:500}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{font-size:11.5px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.ev.p1{background:var(--p1)} .ev.p2{background:var(--p2)} .ev.p3{background:var(--p3)} .ev.p4{background:var(--p4)} .ev.p0{background:var(--muted)}
:root[data-theme="dark"] .ev{color:#0d1510}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev{color:#0d1510}}
.more{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)} .dot.p3{background:var(--p3)} .dot.p4{background:var(--p4)} .dot.p0{background:var(--muted)}

/* 대화상자 */
.dlg-back{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.dlg{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.dlg-back{align-items:center;padding:20px}.dlg{border-radius:14px}}
.dlg h3{font-size:17px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-f .sp{flex:1}
.err{color:var(--danger);font-size:13px;min-height:18px}
.ph-edit{display:flex;flex-wrap:wrap;gap:6px}
.ph-edit div{position:relative}
.ph-edit img{width:70px;height:70px;object-fit:cover;border-radius:6px}
.ph-edit button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:70;max-width:90vw}


/* ── 차례 홈 ── */
:root{--red:#d4281c;--red-soft:#fdeceb;--red-ink:#a3170d;--amb:#9a5a00;--amb-soft:#fff4e2;--amb-line:#f0d3a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff5a4a;--red-soft:#3d1a16;--red-ink:#ff8a7d;--amb:#f0b357;--amb-soft:#33270f;--amb-line:#5c4519}}
:root[data-theme="dark"]{--red:#ff5a4a;--red-soft:#3d1a16;--red-ink:#ff8a7d;--amb:#f0b357;--amb-soft:#33270f;--amb-line:#5c4519}
.alarm{background:var(--red);color:#fff;border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.alarm-k{font-family:var(--font-display);font-size:15px;font-weight:600;padding:4px 10px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px}
.alarm-i{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:2px 0}
.alarm-i span{font-size:14px;opacity:.85}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.headline{font-size:30px;letter-spacing:-.02em;margin:0;flex:1}
.hl-r{color:var(--red)} .hl-a{color:var(--amb)}
.three{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px}
.ch{font-size:20px;margin:0 0 4px} .ch.red{color:var(--red)} .ch.amber{color:var(--amb)}
.tcard{border:0;background:none;padding:0;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:0;border-radius:12px}
.tline{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;width:100%;box-sizing:border-box}
.tline.now{background:var(--red);color:#fff}
.tline.soon{background:var(--red-soft);color:var(--red-ink);box-shadow:inset 0 0 0 1.5px var(--red)}
.tline.later{background:var(--soft);color:var(--ink)}
.tdd{flex:none;min-width:54px;font-weight:700;font-size:14px}
.tline.now .tdd{background:#fff;color:var(--red);border-radius:6px;padding:2px 8px;text-align:center}
.tt{font-size:15px;line-height:1.4}
.uline{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:12px;width:100%;box-sizing:border-box}
.col:nth-child(2) .uline{background:var(--amb-soft);box-shadow:inset 0 0 0 1px var(--amb-line)}
.uage{margin-left:auto;font-weight:700;color:var(--amb);font-size:14px;white-space:nowrap}
.col:nth-child(3) .tcard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.wage{margin-left:auto;color:var(--muted);font-size:13.5px}
.wbar{display:block;height:4px;margin:0 14px 12px;border-radius:2px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--muted)}
.tmore{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:8px 14px 12px;font-size:13.5px;color:var(--muted)}
.tgo{color:var(--accent);font-weight:500;margin-left:auto;cursor:pointer}
.none{color:var(--muted);font-size:14px;padding:12px 0}
.flows{min-width:780px;display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:14px;align-items:center;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.frow:hover{background:var(--soft)}
.fname{display:flex;align-items:baseline;gap:6px} .fname small{color:var(--muted);font-size:11.5px}
.fsteps{display:flex;gap:4px;flex-wrap:wrap}
.fs{font-style:normal;font-size:12px;min-width:58px;text-align:center;padding:5px 7px;border-radius:6px;box-sizing:border-box;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.fs.done{background:var(--soft);border-color:var(--soft)}
.fs.now{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.fs.unk{background:var(--amb-soft);color:var(--amb);border:1.5px dashed var(--amb);font-weight:700}
.fs.skip{text-decoration:line-through;border-style:dashed;opacity:.6}
.fs.plan{border:1.5px dashed var(--ink);color:var(--ink)}
.fturn{font-size:13px;font-weight:700;text-align:right} .fturn.tu{color:var(--red)} .fturn.tm{color:var(--amb)} .fturn.tc{color:var(--muted)}
.ct{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft)}
.ct.t-우리{background:var(--red-soft);color:var(--red-ink)} .ct.t-모름{background:var(--amb-soft);color:var(--amb)}
.planbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.pturns{display:flex;gap:6px;flex-wrap:wrap}
.pt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.pt.on.t-우리{background:var(--red);color:#fff;border-color:var(--red)} .pt.on.t-쿠팡{background:var(--ink);color:var(--bg);border-color:var(--ink)} .pt.on.t-모름{background:var(--amb);color:#fff;border-color:var(--amb)} .pt.on.t-끝{background:var(--muted);color:var(--bg)}
.pnext{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;border:0;background:none;text-align:left;cursor:pointer;padding:4px 2px;font-size:17px}
.pk{color:var(--muted);font-size:13px} .pdue{color:var(--red);font-weight:700} .psince{color:var(--muted);font-size:13px} .pedit{margin-left:auto;color:var(--accent);font-size:13px}
@media (max-width:760px){.three{grid-template-columns:1fr}.headline{font-size:24px}.alarm-i{font-size:16px}}

.feed{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.fitem{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.fitem:hover{background:var(--soft)}
.fwhen{color:var(--muted);font-size:12.5px;width:84px;font-variant-numeric:tabular-nums}
.fwho{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted)} .fwho.ai{background:var(--accent-soft);color:var(--accent)}
.fsite{font-weight:700;min-width:64px} .fsum{flex:1;min-width:200px}
.factions{flex-basis:100%;display:flex;gap:14px;padding-left:96px} .fa{color:var(--accent);font-size:13.5px;font-weight:500} .fa.dim{color:var(--muted)}
.fgroup{display:flex;flex-direction:column;margin-bottom:18px}
.fghead{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:600;font-size:15px;padding:8px 2px;border-bottom:2px solid var(--ink)}
.fghead span{color:var(--muted);font-size:13px;font-weight:400}
.frow:nth-child(odd){background:color-mix(in srgb,var(--soft) 55%,transparent)}
.frow{padding:10px 6px}
.lday{display:flex;flex-direction:column;gap:6px}
.ldate{font-size:16px;display:flex;gap:8px;align-items:baseline} .ldate span{color:var(--muted);font-size:13px;font-weight:400}
.myname{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.myname input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;width:120px}
.myname span{font-size:12.5px}
.sec-h a.sub{text-decoration:none;color:var(--accent)}
/* 휴대폰 */
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11.5px;padding:4px 0}
  .bnav a.on{color:var(--accent)}
  .bnav svg{width:22px;height:22px}
  .editbtn{margin-left:auto}
  .editbtn span{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.grid2{grid-template-columns:1fr}
  .day{min-height:58px}
  .ev{display:none}
  .day .dots{display:flex;gap:2px;flex-wrap:wrap}
  .kv{grid-template-columns:96px 1fr}
}
@media (min-width:761px){.day .dots{display:none}}
</style>
